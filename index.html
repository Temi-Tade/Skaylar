<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Skaylar: Analyze datasets with Benford's Law. Visualize first-digit distributions to detect anomalies, fraud and errors. Open source.">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lexend">
  <title>Skaylar</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>
  <header>
    <div style="display: flex;">
      <img src="./public/skaylar.jpeg" alt="Skaylar Logo" loading="lazy" width="20"/> &nbsp;
      <h1>Skaylar</h1>
    </div>
    
    <div>
      <!-- lucide does not have 3rd party icons, so i had to get the svg with the jelp of AI :) -->
      <a href="https://github.com/Temi-Tade/Skaylar">
        <svg 
          xmlns="http://w3.org" 
          width="24" 
          height="24" 
          viewBox="0 0 24 24" 
          fill="#333" 
          stroke="#333" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round"
        >
          <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
          <path d="M9 18c-4.51 2-5-2-7-2" />
        </svg>

      </a>
    </div>
    
  </header>
  <form id="form">
    <p id="selectedDataset"></p>
    <div>
      <textarea id="data" rows="8" cols="40" placeholder="No dataset detected. Paste data here or select a dataset..."></textarea>
    </div>
      
    <div>
      <button id="runBtn" type="button" >Select Dataset</button>
    </div>
  </form>
  
  <div id="result">
    <div id="details">
      <h3>Dataset</h3>
      <p>Name<span id="dataset"></span></p>
      <p>Description<span id="description"></span></p>
      <p>Source<span id="source"></span></p>
    </div>
    
    <h3>Results</h3>
    <div id="stats">
      <p>Start<span id="starting"></span></p>
      <p>Current<span id="current"></span></p>
      <p>Growth Rate<span id="rate"></span></p>
      <p>Dataset<span id="size"></span></p>
    </div>
    
    <p id="duration"></p>

    <div id="dist-wrap">
      <table id="dist">
        <tr>
          <th>First Digit</th>
          <th>Frequency</th>
          <th>% Occurrence</th>
          <th>% Expected</th>
          <th>Deviation</th>
        </tr>
      </table>
      
      <div id="interpretation">
        <p id="maxDev"></p>
        <p id="chiSquare"></p>
      </div>
    </div>
    
    <div id="graph">
      <div id="graph_label">
        <p id="label_colors">
          <span class="label" id="actual_label">Actual</span>
          <span class="label" id="expected_label">Expected</span>
        </p>
        
        <button id="graph_menu">
          <i data-lucide="ellipsis-vertical" width="16"></i>
        </button>
      </div>
      <svg viewBox="0 0 300 300" width="300" height="300" id="svg"></svg>
    </div>
    
    <div id="actions">
      <button id="runNewBtn">Run New Test &nbsp; <i data-lucide="repeat" width="16"></i></button>
      <button id="saveBtn">Save Dataset &nbsp; <i data-lucide="save" width="16"></i></button>
    </div>
  </div>
  
  <div id="modalbg">
    <div id="modal"></div>
  </div>
  
  <script src="./src/main.js" type="module" defer></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
