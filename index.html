<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lexend">
  <title>Skaylar</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Skaylar</h1>
  </header>
  <form id="form">
    <p id="selectedDataset"></p>
    <div>
      <textarea id="data" rows="8" cols="40" placeholder="No dataset detected. Paste data here or select a dataset..."></textarea>
    </div>
      
    <div>
      <button id="runBtn" type="button">Select Dataset</button>
    </div>
  </form>
  
  <div id="result">
    <div id="details">
      <h3>Dataset</h3>
      <p>Name<span id="dataset"></span></p>
      <p>Description<span id="description"></span></p>
      <p>Source<span id="source"></span></p>
    </div>
    
    <h3>Results</h3>
    <div id="stats">
      <p>Start<span id="starting"></span></p>
      <p>Current<span id="current"></span></p>
      <p>Growth Rate<span id="rate"></span></p>
      <p>Dataset<span id="size"></span></p>
    </div>
    
    <p id="duration"></p>

    <div id="dist-wrap">
      <table id="dist">
        <tr>
          <th>First Digit</th>
          <th>Frequency</th>
          <th>% Occurrence</th>
          <th>% Expected</th>
          <th>Deviation</th>
        </tr>
      </table>
      
      <div id="interpretation">
        <p id="maxDev"></p>
        <p id="chiSquare"></p>
      </div>
    </div>
    
    <div id="graph">
      <div id="graph_label">
        <p>
          <span class="label" id="actual_label">Actual</span>
          <span class="label" id="expected_label">Expected</span>
        </p>
        
        <button id="graph_menu">
          <i data-lucide="ellipsis-vertical" width="16"></i>
        </button>
      </div>
      <svg width="300" height="300" id="svg"></svg>
    </div>
    
    <div id="actions">
      <!--<button id="saveBtn">Save Test</button>-->
      <button id="runNewBtn">Run New Test</button>
    </div>
  </div>
  
  <div id="modalbg">
    <div id="modal"></div>
  </div>
  
  <script src="ui.js" defer></script>
  <script src="main.js" defer></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
